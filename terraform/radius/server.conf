server bustion {
    listen {
        type = auth
        ipaddr = *
        port = 1812
        proto = udp
    }
    authorize {
        if (!&User-Name || !&User-Password || &CHAP-Password || &MS-CHAP-Challenge || &EAP-Message) {
            reject
        }
        update control {
            Auth-Type := python3
        }
    }
    authenticate {
        Auth-Type python3 {
            python3
        }
    }
    post-auth {
        update reply {
            Message-Authenticator := 0x00000000000000000000000000000000
        }
        Post-Auth-Type REJECT {
            update reply {
                Message-Authenticator := 0x00000000000000000000000000000000
            }
        }
    }
}
